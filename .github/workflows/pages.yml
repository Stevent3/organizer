# Baut die v8-App (app/) und deployt GitHub Pages:
#   /organizer/         → v8 (Vite-Build)
#   /organizer/legacy/  → v7 (Ordner legacy/, unverändert, als Rückfallebene)
#   /organizer/next/    → Weiterleitung auf /organizer/ (alte Beta-Adresse)
# Voraussetzung: Repo → Settings → Pages → Source = "GitHub Actions"
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test -- --run
      - name: Build
        working-directory: app
        env:
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          VITE_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Assemble site (v8 root + legacy/ + next/ redirect)
        run: |
          mkdir -p _site/legacy _site/next
          cp -r app/dist/. _site/
          cp -r legacy/. _site/legacy/
          cat > _site/next/index.html <<'EOF'
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/organizer/"><title>Organizer</title></head>
          <body><p>Die App ist umgezogen: <a href="/organizer/">stevent3.github.io/organizer</a></p><script>location.replace('/organizer/' + location.search)</script></body></html>
          EOF
          touch _site/.nojekyll
          find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
