# Baut die neue App (app/) und deployt GitHub Pages:
#   /organizer/       → v7 (Root-Dateien, unverändert)
#   /organizer/next/  → neue App (Vite-Build)
# Voraussetzung: Repo → Settings → Pages → Source = "GitHub Actions"
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test -- --run
      - name: Build
        working-directory: app
        env:
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          VITE_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Assemble site (v7 root + next/)
        run: |
          mkdir -p _site/next
          cp index.html sw.js manifest.json icon-*.png _site/
          cp -r app/dist/. _site/next/
          touch _site/.nojekyll
          find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
